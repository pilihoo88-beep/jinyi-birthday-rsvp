<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JINYI RSVP Admin</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f7f2;margin:0;padding:20px;color:#17324d}.w{max-width:760px;margin:auto}.top{display:flex;gap:12px;margin:18px 0}.box,.row{background:#fff;border-radius:18px;padding:18px}.box{flex:1}.n{font-size:34px;font-weight:800}.row{margin:10px 0;display:grid;grid-template-columns:1fr auto;gap:5px 12px}.name,.guests{font-weight:700;font-size:18px}.time{font-size:13px;color:#687785;grid-column:1/3}.muted{color:#687785}@media(max-width:480px){.top{flex-direction:column}}</style></head><body><div class="w"><h1>JINYI Birthday RSVP</h1><div class="top"><div class="box"><div class="muted">Total guests</div><div id="total" class="n">—</div></div><div class="box"><div class="muted">Responses</div><div id="responses" class="n">—</div></div></div><div id="list">Loading…</div></div><script>const key=new URLSearchParams(location.search).get('key')||'';fetch('/api/admin/rsvps?key='+encodeURIComponent(key)).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{document.getElementById('total').textContent=d.totalGuests;document.getElementById('responses').textContent=d.responses;const list=document.getElementById('list');list.textContent='';if(!d.rows.length){const e=document.createElement('div');e.className='box';e.textContent='No RSVPs yet.';list.appendChild(e);return}d.rows.forEach(x=>{const row=document.createElement('div');row.className='row';const n=document.createElement('div');n.className='name';n.textContent=x.name;const g=document.createElement('div');g.className='guests';g.textContent=x.guests+' guest'+(x.guests===1?'':'s');const t=document.createElement('div');t.className='time';t.textContent=new Date(x.submitted_at).toLocaleString('en-NZ',{timeZone:'Pacific/Auckland'});row.append(n,g,t);list.appendChild(row)})}).catch(()=>document.getElementById('list').textContent='Unable to load RSVPs.');</script></body></html>
