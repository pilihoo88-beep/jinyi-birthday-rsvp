<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JINYI's Birthday Party</title><style>*{box-sizing:border-box}body{margin:0;background:#e9f1e7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:720px;margin:auto;position:relative}.invite{display:block;width:100%;height:auto}.rsvp{position:absolute;left:8%;right:8%;bottom:1%;height:15%;border:0;background:transparent}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.on{display:flex}.card{background:#fffdf4;border-radius:24px;padding:24px;width:min(92vw,420px);box-shadow:0 18px 60px #0005;text-align:center}.card h2{margin:0 0 16px;color:#284b63}.card input{width:100%;font-size:18px;padding:14px;border:2px solid #bdd5c4;border-radius:14px}.btn{margin-top:16px;width:100%;padding:14px;border:0;border-radius:14px;background:#477c69;color:white;font-size:18px;font-weight:700}.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.num{padding:14px 0;border:2px solid #bdd5c4;border-radius:50%;background:white;font-size:18px}.num.sel{background:#477c69;color:#fff}</style></head><body><main class="wrap"><img class="invite" src="/invite.jpg" alt="JINYI birthday invitation"><button class="rsvp" aria-label="RSVP" onclick="openRsvp()"></button></main><div id="m" class="modal"><div class="card" id="c"></div></div><script>let name='',guests=0;const m=document.getElementById('m'),c=document.getElementById('c');function openRsvp(){m.classList.add('on');c.innerHTML='<h2>Who’s coming?</h2><input id="n" placeholder="Name / Family name" autocomplete="name"><button class="btn" onclick="next()">Next</button>'}function next(){let n=document.getElementById('n').value.trim();if(!n)return;name=n;c.innerHTML='<h2>How many are coming?</h2><div class="nums">'+[1,2,3,4,5].map(x=>'<button class="num" onclick="pick('+x+',this)">'+x+'</button>').join('')+'</div><button class="btn" onclick="send()">Submit RSVP</button>'}function pick(x,b){guests=x;document.querySelectorAll('.num').forEach(e=>e.classList.remove('sel'));b.classList.add('sel')}async function send(){if(!guests)return;let r=await fetch('/api/rsvp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,guests})});if(r.ok)c.innerHTML='<h2>Thank you! 🎉</h2><p>See you at JINYI’s party!</p><button class="btn" onclick="m.classList.remove(\'on\')">Done</button>';else alert('Please try again.')}m.onclick=e=>{if(e.target===m)m.classList.remove('on')}</script></body></html>
